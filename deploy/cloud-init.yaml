#cloud-config
# Vultr Cloud Compute, Ubuntu 24.04. Installs Docker + gVisor (runsc), builds the clean-room image, runs the app.
# The inference key is written to /etc/cleanroom.env by deploy/setup.sh over ssh, never baked into the image.
package_update: true
packages: [ca-certificates, curl, gnupg, git, python3-venv, ufw]
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - curl -fsSL https://gvisor.dev/archive.key | gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" > /etc/apt/sources.list.d/gvisor.list
  - apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io runsc
  - runsc install && systemctl restart docker
  - ufw allow 22/tcp && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable
